name: Windows x64 portable ABIS

on:
  workflow_dispatch:
    inputs:
      r_version:
        description: R version from the CRAN Windows archive
        required: true
        default: '4.5.2'
        type: string
      include_results:
        description: Include data/results.csv instead of synthetic sample data
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build and test offline bundle
        shell: pwsh
        env:
          ABIS_R_VERSION: ${{ inputs.r_version }}
          ABIS_INCLUDE_RESULTS: ${{ inputs.include_results }}
        run: |
          & ./abis-threshold-analysis/windows/build.ps1 `
            -RVersion $env:ABIS_R_VERSION `
            -IncludeResults ($env:ABIS_INCLUDE_RESULTS -eq 'true')
      - name: Upload portable ZIP and checksum
        uses: actions/upload-artifact@v4
        with:
          name: abis-windows-x64
          path: |
            dist/abis-windows-x64.zip
            dist/abis-windows-x64.zip.sha256
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
